name: Atlas WebKit history reload diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'repro/atlas-history/**'
      - '.github/workflows/atlas-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verdict-timeout-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout lab diagnostic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout old Atlas (fixed HEAD)
        uses: actions/checkout@v4
        with:
          repository: tetsujisugimori-coder/historical-source-atlas
          ref: 3e56d13d77048d056e79c6971e6e7d24ad92b4ff
          path: atlas-old
      - name: Checkout current Atlas (fixed HEAD)
        uses: actions/checkout@v4
        with:
          repository: tetsujisugimori-coder/historical-source-atlas
          ref: 4fc74a0b6a531397914b16d8d38768ac8107803c
          path: atlas-current
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests for event order and classification
        run: node --test repro/atlas-history/verdict.test.cjs
      - name: Install pinned Playwright and WebKit only
        run: |
          npm install --no-save --ignore-scripts --package-lock=false --prefix repro/atlas-history playwright@1.56.1
          ./repro/atlas-history/node_modules/.bin/playwright install --with-deps webkit
      - name: Recheck exactly the two previous TIMEOUT conditions
        shell: bash
        run: |
          mkdir -p evidence/atlas-history-pr17-followup
          set +e
          node repro/atlas-history/run.cjs evidence/atlas-history-pr17-followup --only-pr17-timeouts > evidence/atlas-history-pr17-followup/stdout.txt 2> evidence/atlas-history-pr17-followup/stderr.txt
          code=$?
          printf '%s\n' "$code" > evidence/atlas-history-pr17-followup/exit.txt
          cat evidence/atlas-history-pr17-followup/stdout.txt
          cat evidence/atlas-history-pr17-followup/stderr.txt >&2
          exit "$code"
      - name: Preserve separate follow-up outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-history-pr17-followup-${{ github.run_id }}
          path: evidence/atlas-history-pr17-followup/
          if-no-files-found: error
          retention-days: 7
